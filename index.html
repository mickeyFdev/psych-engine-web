		<script>
			// The old asset worker can keep intercepting requests after a deploy.
			// Remove it before Lime starts so it cannot crash the OpenFL preload.
			window.__psychEngineBootReady = Promise.resolve();
			if ('serviceWorker' in navigator) {
				window.__psychEngineBootReady = navigator.serviceWorker.getRegistrations()
					.then(function (registrations) {
						if (!registrations.length) return;
						return Promise.all(registrations.map(function (registration) {
							return registration.unregister();
						})).then(function () {
							if (navigator.serviceWorker.controller && !sessionStorage.psychEngineWorkerRemoved) {
								sessionStorage.psychEngineWorkerRemoved = '1';
								location.reload();
								return new Promise(function () {});
							}
						});
					})
					.catch(function (error) { console.warn('Service worker cleanup unavailable; continuing normally.', error); });
			}
		</script>
		
		<script type="text/javascript" src="./PsychEngine.js"></script>
	
	<script>
		window.addEventListener ("touchmove", function (event) { event.preventDefault (); }, { capture: false, passive: false });
		if (typeof window.devicePixelRatio != 'undefined' && window.devicePixelRatio > 2) {
			var meta = document.getElementById ("viewport");
			meta.setAttribute ('content', 'width=device-width, initial-scale=' + (2 / window.devicePixelRatio) + ', user-scalable=no');
		}
	</script>
	
	<style>
		html,body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
			#openfl-content { background: #000000; width: 100%; height: 100%; min-height: 100dvh; display: flex; align-items: center; justify-content: center; overflow: hidden; }
			#openfl-content canvas { display: block; width: min(100%, calc(100dvh * 16 / 9)) !important; height: auto !important; max-height: 100% !important; aspect-ratio: 16 / 9; object-fit: contain; }
			#mobile-controls, #mobile-fullscreen { display: none; }
			@media (pointer: coarse), (max-width: 700px) {
				#mobile-controls { display: flex; position: fixed; z-index: 20; inset: auto 0 max(10px, env(safe-area-inset-bottom)) 0; align-items: flex-end; justify-content: space-between; padding: 0 max(10px, env(safe-area-inset-left)) 0 max(10px, env(safe-area-inset-right)); pointer-events: none; box-sizing: border-box; }
				.mobile-lanes { display: grid; grid-template-columns: repeat(4, minmax(48px, 13vw)); gap: 6px; pointer-events: auto; }
				.mobile-actions { display: flex; align-items: flex-end; gap: 6px; pointer-events: auto; }
				.mobile-key { appearance: none; -webkit-tap-highlight-color: transparent; touch-action: none; user-select: none; border: 2px solid rgba(255,255,255,.72); color: #fff; background: rgba(15,15,25,.72); box-shadow: 0 3px 0 rgba(0,0,0,.55); font: 700 14px/1 Arial, sans-serif; text-shadow: 0 1px 2px #000; }
				.mobile-key.is-pressed { transform: translateY(3px); border-color: #fff; box-shadow: none; }
				.mobile-key.lane { width: min(13vw, 78px); height: min(13vw, 78px); min-width: 48px; min-height: 48px; border-radius: 14px; font-size: clamp(24px, 7vw, 42px); }
				.mobile-key.lane:nth-child(1) { border-color: #a855f7; color: #e9d5ff; background: rgba(168,85,247,.28); }
				.mobile-key.lane:nth-child(2) { border-color: #3b82f6; color: #dbeafe; background: rgba(59,130,246,.28); }
				.mobile-key.lane:nth-child(3) { border-color: #22c55e; color: #dcfce7; background: rgba(34,197,94,.28); }
				.mobile-key.lane:nth-child(4) { border-color: #ef4444; color: #fee2e2; background: rgba(239,68,68,.28); }
				.mobile-key.lane:nth-child(1).is-pressed { background: rgba(168,85,247,.85); }
				.mobile-key.lane:nth-child(2).is-pressed { background: rgba(59,130,246,.85); }
				.mobile-key.lane:nth-child(3).is-pressed { background: rgba(34,197,94,.85); }
				.mobile-key.lane:nth-child(4).is-pressed { background: rgba(239,68,68,.85); }
				.mobile-key.action { min-width: 58px; height: 42px; padding: 0 7px; border-radius: 10px; font-size: 12px; }
				.mobile-key.accept { background: rgba(30,120,55,.78); }
				#mobile-fullscreen { display: block; position: fixed; z-index: 21; top: max(8px, env(safe-area-inset-top)); right: max(8px, env(safe-area-inset-right)); padding: 8px 10px; border: 1px solid rgba(255,255,255,.65); border-radius: 8px; color: #fff; background: rgba(0,0,0,.58); font: 12px Arial, sans-serif; }
			@media (max-width: 700px) and (orientation: portrait) {
				#mobile-controls { flex-wrap: wrap; justify-content: center; gap: 6px; }
				.mobile-lanes, .mobile-actions { flex: 1 1 100%; justify-content: center; }
				.mobile-key.action { min-width: 52px; }
			}
			}
